<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ADEMICON BENJAMIM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Existing custom styles */
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', sans-serif; /* Using Inter font as per guidelines */
    }
    .div { width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }

    /* Music player styles, now for the report switcher button */
    .music-player {
      position: absolute;
      bottom: 60px; /* Increased bottom value to move the button down */
      right: 50px;
      background: transparent; /* Changed to transparent as it's just a button container now */
      padding: 8px;
      border-radius: 10px;
      color: black;
      font-family: sans-serif;
      text-align: left;
      font-size: 0.8rem;
      transform: scale(0.8);
      transform-origin: bottom right;
      z-index: 1000;
      /* Adjust flex for button centering if needed */
      display: flex;
      justify-content: flex-end; /* Aligns button to the right within the container */
      align-items: center;
    }
    .music-player button {
      background: transparent; /* Original button styles, Tailwind will override for the new button */
      border: 1px solid black;
      color: black;
      margin: 4px 0 0 4px;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 5px;
      transition: background 0.3s;
      font-size: 0.75rem;
    }
    .music-player button:hover {
      background: rgba(0, 0, 0, 0.1);
    }
    /* .music-player audio { width: 100%; margin-top: 8px; background: transparent; } Removed as audio is disabled */
    #popupVenda {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 4px solid #7d1202;
      border-radius: 20px;
      padding: 40px;
      z-index: 9999;
      /*font-size: 3rem;*/
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);


      width: 70vw;
      max-width: 2500px;
      min-width: 600px;
      height: auto;
      max-height: 90vh;
      overflow-y: auto;
    }
    #listaValoresMultiplasVendas {
      /* Centraliza o texto de cada item da lista */
      text-align: center;
      /* Remove o preenchimento padrão da lista para que o texto possa centralizar melhor */
      padding-left: 0;
      /* font-size: 2rem;*/
    }

    #popupVenda strong,
    #popupVenda span {
      /* Use vw para o texto principal do vendedor/mensagem */
      font-size: clamp(1.9rem, 3.5vw, 7rem); /* Min 1.8rem, ideal 3.5vw, 
      max 3rem */
    }
    #popupVenda strong#vendedorNome {
      /* Use vw para o texto principal do vendedor/mensagem */
      font-size: clamp(1.9rem, 3.5vw, 7rem); /* Mantenha o tamanho da fonte */
      color: #7d1202; /* Agora aplica a cor vermelha apenas ao strong#vendedorNome */
    }

    #listaValoresMultiplasVendas li {
      /* Ajuste para os itens da lista individual */
      font-size: clamp(1.5rem, 3.2vw, 6rem); /* Min 1.2rem, ideal 2.5vw, max 2.2rem */
    }

    /* Ajuste para o TOTAL */
    #listaValoresMultiplasVendas li.font-bold.text-total-xl { /* Use a classe que você definiu para o total */
      font-size: clamp(1.9rem, 3.5vw, 7rem); /* Min 1.8rem, ideal 3.5vw, max 3rem */
    }

    #confetes { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
    .confete {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      opacity: 0.7;
      animation: cair 15s linear forwards;
    }
    @keyframes cair {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(800px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="div">
    <iframe
      id="powerBiIframe"
      title="RESULTADO BENJAMIM"
      src="https://app.powerbi.com/reportEmbed?reportId=3b0dc507-5987-46f5-9a7f-4c5761c4d476&autoAuth=true&ctid=38ae2f02-5710-4e12-80bb-83600c3fdf1e"
      allowFullScreen="true">
    </iframe>
  </div>

  <div id="popupVenda">
    <div id="confetes"></div>
    <div class="popup-content">
      <strong id="vendedorNome">Vendedor</strong> <span id="vendaMensagem"> <class="text-red-700"> </class></span> <strong id="valorVenda"></strong>
      <ul id="listaValoresMultiplasVendas" class="text-left mt-4 text-xl" style="list-style-type: none; padding-left: 0;"></ul>
    </div>
  </div>

  <audio id="somSino" src="./musics/sino.mp3" preload="auto"></audio>

  <div class="music-player">
    <button
      id="switchReportBtn"
      onclick="toggleReport()"
      class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 flex items-center justify-center"
    >
      <img src="./reload.png" alt="Alternar Relatório" class="w-12 h-12">
    </button>
  </div>

  <script>
    const powerBiIframe = document.getElementById("powerBiIframe");

    // Existing interval to refresh the iframe
    setInterval(() => {
      const url = new URL(powerBiIframe.src);
      url.searchParams.set('refresh', Date.now());
      powerBiIframe.src = url.toString();
    }, 600000); // Refreshes every 10 minutes

    // --- New JavaScript for report switching ---
    const primaryReportUrl = "https://app.powerbi.com/reportEmbed?reportId=3b0dc507-5987-46f5-9a7f-4c5761c4d476&autoAuth=true&ctid=38ae2f02-5710-4e12-80bb-83600c3fdf1e";
    const secondaryReportUrl = "https://app.powerbi.com/reportEmbed?reportId=af95b36a-dddd-443f-bc1a-9eb4086e3558&autoAuth=true&embeddedDemo=true";
    let currentReportIsPrimary = true; // Tracks which report is currently displayed

    function toggleReport() {
        if (currentReportIsPrimary) {
            powerBiIframe.src = secondaryReportUrl;
        } else {
            powerBiIframe.src = primaryReportUrl;
        }
        currentReportIsPrimary = !currentReportIsPrimary; // Toggle the state
        // Reset the 'recarregado' flag so the next sale popup follows the initial delay logic
        powerBiIframe.dataset.recarregado = "";
        console.log("Report switched to: " + powerBiIframe.src); // For debugging
    }
    // --- End of new JavaScript for report switching ---

  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // Firebase configuration (ensure this matches your project's config)
    const firebaseConfig = {
      apiKey: "AIzaSyBtglLEILTBGsjMMu-4MgASiOPxB09J54k",
      authDomain: "vendas-benjamim.firebaseapp.com",
      databaseURL: "https://vendas-benjamim-default-rtdb.firebaseio.com",
      projectId: "vendas-benjamim",
      storageBucket: "vendas-benjamim.appspot.com",
      messagingSenderId: "724497746206",
      appId: "1:724497746206:web:da08123fbf66ac60bfa10f",
      measurementId: "G-N663CRJV9H"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const som = document.getElementById("somSino");
    const nomeElem = document.getElementById("vendedorNome");
    const valorElem = document.getElementById("valorVenda");
    const vendaMensagem = document.getElementById("vendaMensagem"); // New element for the message
    const listaValoresMultiplasVendas = document.getElementById("listaValoresMultiplasVendas"); // New element for list of values
    const popup = document.getElementById("popupVenda");
    const container = document.getElementById("confetes");
    const iframe = document.getElementById("powerBiIframe");

    let exibindo = false;
    let filaDeVendasCompleta = [];
    let vendasEmExibicao = {};

    let debounceTimer;
     let aguardandoProximaFila = false;

    function exibirVenda(vendasDoVendedor) {
      if (vendasDoVendedor.length === 0) return;

      exibindo = true;
      aguardandoProximaFila = false;

      vendasEmExibicao = vendasDoVendedor;

      const primeiroVenda = vendasDoVendedor[0].data;
      nomeElem.textContent = primeiroVenda.vendedor;
      valorElem.innerHTML = ""; // Clear previous content
      vendaMensagem.innerHTML = ""; // Clear previous content
      listaValoresMultiplasVendas.innerHTML = ""; // Clear previous content

      if (vendasDoVendedor.length === 1) {
        // Single sale
        vendaMensagem.innerHTML = `<br>fez uma venda de`;
        valorElem.textContent = Number(primeiroVenda.valor).toLocaleString('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        });
      } else {
        // Multiple sales for the same salesperson
        vendaMensagem.innerHTML = `<br>fez <strong>${vendasDoVendedor.length}</strong> vendas:`;
        let totalVendas = 0;

        vendasDoVendedor.forEach((venda, index) => {
          const li = document.createElement("li");
          li.classList.add("mb-3");
          li.innerHTML = `<strong>${index + 1}ª - ${Number(venda.data.valor).toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL'
          })}</strong>`;
          listaValoresMultiplasVendas.appendChild(li);
          totalVendas += Number(venda.data.valor);
        });
      
      // --- ADD THIS BLOCK FOR THE TOTAL ---
      const totalLi = document.createElement("li");
      totalLi.classList.add("mt-4", "font-bold", "text-red-700"); // Tailwind classes for styling the total
      totalLi.innerHTML = `TOTAL: ${totalVendas.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      })}`;
      listaValoresMultiplasVendas.appendChild(totalLi);
      // --- END OF TOTAL BLOCK ---
      }

      popup.style.display = "block";
      som.play();

      let tempoConfete = 0;
      const intervaloConfete = setInterval(() => {
        for (let i = 0; i < 10; i++) {
          const confete = document.createElement("div");
          confete.className = "confete";
          confete.style.left = `${Math.random() * 100}%`;
          confete.style.top = `${Math.random() * 10}%`;
          confete.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
          confete.style.animationDelay = `${Math.random()}s`;
          container.appendChild(confete);
        }
        tempoConfete += 1;
        if (tempoConfete >= 15) clearInterval(intervaloConfete);
      }, 1000);

      setTimeout(() => {
        popup.style.display = "none";
        container.innerHTML = "";

        // Remove todas as vendas que foram exibidas do Firebase
        // Isso vai disparar o onValue novamente, mas o debounce vai lidar com isso.
        const removePromises = vendasEmExibicao.map(venda => remove(ref(database, `vendas/fila/${venda.key}`)));
        Promise.all(removePromises)
          .then(() => {
            console.log("Vendas removidas do Firebase com sucesso.");
            // Após a remoção e o onValue ter processado, exibindo será falso e a fila será reavaliada.
            // Não chame processarFila aqui diretamente, deixe o onValue e o debounce cuidarem disso.
            exibindo = false; // Resetar após a remoção ser iniciada
          })
          .catch((error) => {
            console.error("Erro ao remover vendas do Firebase:", error);
            // Em caso de erro, ainda precisamos resetar para tentar novamente
            exibindo = false;
            processarFila(); // Tenta processar a fila mesmo com erro de remoção
          });

        vendasEmExibicao = []; // Limpa o array de vendas em exibição
        // Não chame processarFila() aqui. Deixe o onValue com debounce fazer isso.
      }, 15000); // Popup exibido por 15 segundos
    }

    function processarFila() {
        // Se já estamos exibindo algo, ou se já marcamos para aguardar a próxima fila,
        // não inicie um novo processamento imediatamente.
        if (exibindo || aguardandoProximaFila) {
            console.log("Já exibindo ou aguardando próxima fila. Pulando processarFila.");
            return;
        }

        if (filaDeVendasCompleta.length === 0) {
            console.log("Fila de vendas vazia.");
            iframe.dataset.recarregado = ""; // Resetar flag se a fila está vazia
            return;
        }

        const vendasAgrupadasPorVendedor = {};
        filaDeVendasCompleta.forEach(({ key, data }) => {
            if (!vendasAgrupadasPorVendedor[data.vendedor]) {
                vendasAgrupadasPorVendedor[data.vendedor] = [];
            }
            vendasAgrupadasPorVendedor[data.vendedor].push({ key, data });
        });

        let primeiroVendedorNome = null;
        let menorTimestamp = Infinity;

        for (const vendedor in vendasAgrupadasPorVendedor) {
            const vendasDoVendedor = vendasAgrupadasPorVendedor[vendedor];
            const timestampMaisAntigoDoVendedor = Math.min(...vendasDoVendedor.map(v => v.data.timestamp));

            if (timestampMaisAntigoDoVendedor < menorTimestamp) {
                menorTimestamp = timestampMaisAntigoDoVendedor;
                primeiroVendedorNome = vendedor;
            }
        }

        if (!primeiroVendedorNome) {
            console.log("Nenhum vendedor encontrado para processar na fila agrupada.");
            return;
        }

        const vendasDoVendedorAtual = vendasAgrupadasPorVendedor[primeiroVendedorNome];

        // Marca que estamos prestes a exibir, o que deve impedir novas chamadas até que termine.
        aguardandoProximaFila = true; // Define esta flag antes de exibir

        if (!iframe.dataset.recarregado) {
            const url = new URL(iframe.src);
            url.searchParams.set('refresh', Date.now());
            iframe.src = url.toString();
            iframe.dataset.recarregado = "true";

            setTimeout(() => {
                exibirVenda(vendasDoVendedorAtual);
            }, 10000);
        } else {
            exibirVenda(vendasDoVendedorAtual);
        }
    }

    // LISTENER onValue - Principalmente inalterado, mas a interação com processarFila mudou.
    onValue(ref(database, 'vendas/fila'), (snapshot) => {
        clearTimeout(debounceTimer);

        debounceTimer = setTimeout(() => {
            const filaRaw = snapshot.val();
            filaDeVendasCompleta = [];

            if (filaRaw) {
                Object.entries(filaRaw)
                    .sort((a, b) => a[1].timestamp - b[1].timestamp)
                    .forEach(([key, data]) => {
                        filaDeVendasCompleta.push({ key, data });
                    });
            }

            if (filaDeVendasCompleta.length === 0) {
                iframe.dataset.recarregado = "";
            }

            // Apenas chame processarFila se não estivermos já exibindo algo.
            // Se "aguardandoProximaFila" for true, significa que uma exibição já foi agendada/está em andamento,
            // e o próximo ciclo será ativado após o timeout de exibição.
            if (!exibindo) {
                processarFila();
            } else {
                console.log("onValue disparado, mas um pop-up já está exibindo. Aguardando o término.");
            }

        }, 300); // Ajuste este atraso conforme o necessário
    });
  </script>
</body>
</html>
